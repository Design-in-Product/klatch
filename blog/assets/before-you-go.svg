  <title id="handoff-title">A folder of field notes left on a desk, with one card pinned, beside a fresh notebook for the next shift</title>
  <desc id="handoff-desc">A still-life illustration in muted slate tones. A desk surface holds a labeled folder marked FIELD NOTES with three index cards stacked on top. One card has a small red pin in its corner — the note that has been reviewed and approved. To the right sits a fresh, closed notebook waiting for whoever comes next. A desk lamp's soft glow falls across the scene.</desc>

