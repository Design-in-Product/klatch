    <rect x="0" y="0" width="640" height="150" fill="#f1f5f9"/>

    <polygon points="190,168 450,168 512,262 128,262" rx="6" fill="#dde4f0"/>
    <polygon points="128,262 512,262 516,268 124,268" fill="#b0bfd3"/>
    <line x1="190" y1="168" x2="450" y2="168" stroke="#cbd5e1" stroke-width="0.75"/>

