<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="klatch-title" aria-describedby="klatch-desc">
    <title id="klatch-title">Conversation cards gathered at a shared table, one being set into place, one marked as a role</title>
    <desc id="klatch-desc">A still-life in muted slate tones. An oblique round-cornered table — the klatch — has standing cards at its seats, each card an existing conversation with a name tab and a few lines of text. One card is tilted, mid-placement, being brought into the room. One seated card carries a small red marker: a conversation that has been promoted into a persistent role.</desc>

