      <svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zones-title">
        <title id="zones-title">Three zones of knowledge at different scopes — project stacks, channel reading room, and message desk — with promotion arrows flowing upward</title>

        <rect width="640" height="340" fill="#f8fafc"/>

        <!-- Zone 1: Stacks (Project) — leftmost, tallest, most muted -->
        <rect x="40" y="40" width="160" height="220" rx="4" fill="#dde4f0"/>
        <!-- Shelf lines -->
        <line x1="56" y1="80" x2="184" y2="80" stroke="#b0bfd3" stroke-width="1"/>
        <line x1="56" y1="115" x2="184" y2="115" stroke="#b0bfd3" stroke-width="1"/>
        <line x1="56" y1="150" x2="184" y2="150" stroke="#b0bfd3" stroke-width="1"/>
        <line x1="56" y1="185" x2="184" y2="185" stroke="#b0bfd3" stroke-width="1"/>
        <line x1="56" y1="220" x2="184" y2="220" stroke="#b0bfd3" stroke-width="1"/>
        <!-- Books on shelves -->
        <rect x="62" y="60" width="8" height="18" rx="1" fill="#7a94ab"/>
        <rect x="73" y="56" width="10" height="22" rx="1" fill="#4a6175"/>
        <rect x="86" y="62" width="7" height="16" rx="1" fill="#7a94ab"/>
        <rect x="96" y="58" width="9" height="20" rx="1" fill="#b0bfd3"/>
        <rect x="108" y="60" width="8" height="18" rx="1" fill="#4a6175"/>
        <rect x="120" y="57" width="10" height="21" rx="1" fill="#7a94ab"/>
        <rect x="134" y="61" width="7" height="17" rx="1" fill="#b0bfd3"/>
        <rect x="145" y="56" width="9" height="22" rx="1" fill="#4a6175"/>
        <rect x="62" y="96" width="9" height="17" rx="1" fill="#b0bfd3"/>
        <rect x="74" y="93" width="8" height="20" rx="1" fill="#7a94ab"/>
        <rect x="86" y="97" width="10" height="16" rx="1" fill="#4a6175"/>
        <rect x="100" y="94" width="7" height="19" rx="1" fill="#b0bfd3"/>
        <rect x="111" y="96" width="9" height="17" rx="1" fill="#7a94ab"/>
        <rect x="62" y="131" width="10" height="17" rx="1" fill="#4a6175"/>
        <rect x="76" y="128" width="8" height="20" rx="1" fill="#b0bfd3"/>
        <rect x="88" y="132" width="9" height="16" rx="1" fill="#7a94ab"/>
        <!-- File icon on a shelf -->
        <rect x="62" y="166" width="14" height="17" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <polyline points="70,166 76,172 76,166" fill="#dde4f0" stroke="#4a6175" stroke-width="0.75"/>
        <rect x="80" y="168" width="14" height="17" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <rect x="98" y="166" width="14" height="17" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <!-- Label -->
        <text x="120" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">THE STACKS</text>
        <text x="120" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">Project knowledge base</text>
        <text x="120" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">Every conversation sees it</text>

        <!-- Zone 2: Reading Room (Channel) — middle, medium height -->
        <rect x="240" y="80" width="160" height="180" rx="4" fill="#b0bfd3"/>
        <!-- Table surface -->
        <rect x="256" y="140" width="128" height="6" rx="2" fill="#7a94ab"/>
        <!-- Items on table -->
        <rect x="264" y="118" width="18" height="22" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <line x1="268" y1="126" x2="278" y2="126" stroke="#94a3b8" stroke-width="0.75"/>
        <line x1="268" y1="130" x2="276" y2="130" stroke="#94a3b8" stroke-width="0.75"/>
        <line x1="268" y1="134" x2="278" y2="134" stroke="#94a3b8" stroke-width="0.75"/>
        <rect x="290" y="114" width="18" height="26" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <line x1="294" y1="122" x2="304" y2="122" stroke="#94a3b8" stroke-width="0.75"/>
        <line x1="294" y1="126" x2="302" y2="126" stroke="#94a3b8" stroke-width="0.75"/>
        <line x1="294" y1="130" x2="304" y2="130" stroke="#94a3b8" stroke-width="0.75"/>
        <line x1="294" y1="134" x2="301" y2="134" stroke="#94a3b8" stroke-width="0.75"/>
        <rect x="316" y="120" width="18" height="20" rx="1" fill="#ffffff" stroke="#4a6175" stroke-width="1"/>
        <!-- Pin icon on one doc -->
        <circle cx="273" cy="112" r="4" fill="#EF4444"/>
        <line x1="273" y1="116" x2="273" y2="118" stroke="#EF4444" stroke-width="1.5"/>
        <!-- Label -->
        <text x="320" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">READING ROOM</text>
        <text x="320" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">Channel pinned files</text>
        <text x="320" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">This conversation's focus</text>

        <!-- Zone 3: Desk (Message) — rightmost, shortest, most vivid -->
        <rect x="440" y="120" width="160" height="140" rx="4" fill="#4a6175"/>
        <!-- Open document -->
        <rect x="468" y="138" width="40" height="52" rx="2" fill="#ffffff"/>
        <line x1="474" y1="148" x2="502" y2="148" stroke="#94a3b8" stroke-width="1"/>
        <line x1="474" y1="154" x2="498" y2="154" stroke="#94a3b8" stroke-width="1"/>
        <line x1="474" y1="160" x2="502" y2="160" stroke="#94a3b8" stroke-width="1"/>
        <line x1="474" y1="166" x2="495" y2="166" stroke="#94a3b8" stroke-width="1"/>
        <line x1="474" y1="172" x2="500" y2="172" stroke="#94a3b8" stroke-width="1"/>
        <line x1="474" y1="178" x2="490" y2="178" stroke="#94a3b8" stroke-width="1"/>
        <!-- Cursor / active indicator -->
        <rect x="474" y="182" width="2" height="4" fill="#EF4444"/>
        <!-- Pencil -->
        <line x1="524" y1="180" x2="540" y2="148" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <polygon points="524,180 521,184 527,184" fill="#ffffff"/>
        <!-- Label -->
        <text x="520" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">YOUR DESK</text>
        <text x="520" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b5c8d8">Message attachments</text>
        <text x="520" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b5c8d8">Right now, this moment</text>

        <!-- Promotion arrows (right to left, upward flow) -->
        <line x1="436" y1="195" x2="404" y2="195" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
        <polygon points="406,191 398,195 406,199" fill="#94a3b8"/>
        <line x1="236" y1="175" x2="204" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
        <polygon points="206,171 198,175 206,179" fill="#94a3b8"/>

        <!-- Promotion labels -->
        <text x="420" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">pin</text>
        <text x="220" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">promote</text>

        <!-- Bottom tagline -->
        <text x="320" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">Knowledge rises as it proves its value.</text>

      </svg>
