      <svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tesler-title">
        <title id="tesler-title">A horizontal bar representing irreducible complexity, with a sliding divider between 'User absorbs' and 'System absorbs'</title>

        <rect width="640" height="280" fill="#f8fafc"/>

        <!-- The bar -->
        <rect x="80" y="100" width="480" height="60" rx="4" fill="#e2e8f0"/>

        <!-- User side -->
        <rect x="80" y="100" width="200" height="60" rx="4" fill="#b5c8d8"/>
        <text x="180" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">User absorbs</text>

        <!-- System side -->
        <rect x="280" y="100" width="280" height="60" fill="#4a6175"/>
        <rect x="560" y="100" width="0" height="60" rx="4" fill="#4a6175"/>
        <path d="M560,100 Q564,100 564,104 L564,156 Q564,160 560,160 L560,100 Z" fill="#4a6175"/>
        <text x="420" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">System absorbs</text>

        <!-- Divider handle -->
        <rect x="275" y="92" width="10" height="76" rx="3" fill="#1e293b"/>
        <line x1="278" y1="122" x2="282" y2="122" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
        <line x1="278" y1="130" x2="282" y2="130" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
        <line x1="278" y1="138" x2="282" y2="138" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>

        <!-- Arrows showing the slide -->
        <text x="230" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#94a3b8">&#8592;</text>
        <text x="330" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#94a3b8">&#8594;</text>

        <!-- Top label -->
        <text x="320" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.08em">IRREDUCIBLE COMPLEXITY</text>
        <text x="320" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">can be moved, never removed</text>

        <!-- Three clocks below -->
        <text x="320" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">Without a unified model, you become the synchronization layer</text>

        <circle cx="180" cy="240" r="14" fill="none" stroke="#b5c8d8" stroke-width="2"/>
        <text x="180" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748b">Chat</text>
        <circle cx="320" cy="240" r="14" fill="none" stroke="#4a6175" stroke-width="2"/>
        <text x="320" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" fill="#334155">Code</text>
        <circle cx="460" cy="240" r="14" fill="none" stroke="#1e293b" stroke-width="2"/>
        <text x="460" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" fill="#1e293b">Cowork</text>

        <!-- Drift lines -->
        <line x1="194" y1="240" x2="306" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="334" y1="240" x2="446" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

      </svg>
